      {
        name: "Prof. Ali Kashif Bashir",

      <h2 class="section-title">Research Collaborators</h2>
      <div class="research-grid">

              ${c.coauthored} co-authored paper${c.coauthored !== 1 ? "s" : ""}

          </div>
        `).join("")}
      </div>
    `;

    /**
     * HOW TO ADD A STUDENT:
     * Copy one entry in STUDENTS and fill in the fields.
     */
    const STUDENTS = [
      {
        name: "Muhammad Ilyas Shahid",
        level: "Ph.D. (co-supervised)",
        topic: "Robust Federated Learning under Adversarial Conditions",
        status: "active",
        year: 2024,
      },
      // Add more students here
    ];

    document.getElementById("students-card").innerHTML = `
      <h2 class="section-title">Students</h2>
      ${STUDENTS.length > 0 ? `
        <div class="timeline">
          ${STUDENTS.map(s => `
            <div class="timeline-item ${s.status === 'active' ? 'current' : ''}">

                <div class="timeline-title">${s.name}</div>
                <div class="timeline-org">${s.level}</div>

          `).join("")}

        <div class="metrics-row" style="border-radius:8px; max-width:480px;">
          <div class="metric-item"><span class="metric-value">2</span><span class="metric-label">Ph.D. (co-sup.)</span></div>

      </div>
    `;

    document.getElementById("openings-card").innerHTML = `

      <div style="padding:16px; border:1px dashed var(--border); border-radius:8px; font-size:.9rem; color:var(--text-muted);">

        </p>

          <a href="mailto:${PROFILE.email}">${PROFILE.email}</a>
          with your CV and a brief description of your research interests.
        </p>
      </div>
    `;

</body>
</html>
